server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;
  types { application/manifest+json webmanifest; }
  location ~* \.(woff2|png)$ { expires 30d; add_header Cache-Control "public"; }
  location ~* \.(js|html|webmanifest)$ { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
